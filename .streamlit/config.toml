# Optional but recommended: this does most of the "looks expensive"
# work before ui/styles.py's CSS layer even runs. Values match the
# palette in ui/styles.py — if you tweak one, tweak the other.

[theme]
base = "dark"
primaryColor = "#4dd8c0"
backgroundColor = "#05070a"
secondaryBackgroundColor = "#0b0f16"
textColor = "#d7e4e0"
font = "monospace"

[client]
toolbarMode = "minimal"
